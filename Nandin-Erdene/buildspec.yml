version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 20
    commands:
      # Upgrade pip
      - python3 -m pip install --upgrade pip
      # Install Python dependencies
      - pip install -r Nandin-Erdene/requirements.txt
      # Install CDK
      - npm install -g aws-cdk@2.156.0

  build:
    commands:
      - cd Nandin-Erdene

      # Ensure Lambda folder exists
      - mkdir -p lib/lambda_handler

      # Create dummy Lambda for CI/CD (avoids "Cannot find asset" errors)
      - echo "def lambda_handler(event, context): return {'statusCode': 200, 'body': 'Placeholder'}" > lib/lambda_handler/WHlambda.py
      - echo "def lambda_handler(event, context): return {'statusCode': 200, 'body': 'Placeholder'}" > lib/lambda_handler/alarm_logger.py

      # Synthesize CDK stack
      - npx cdk synth

artifacts:
  base-directory: Nandin-Erdene/cdk.out
  files:
    - '**/*'
